# ============================================================
# 工作流：GitHub Issues → Hugo 构建 → Cloudflare Pages 部署
# ============================================================
# 触发条件：
#   1. 当 Issue 被创建/编辑/关闭/重新打开/打标签时
#   2. 每天定时同步一次（防止遗漏）
#   3. 手动触发
#
# 完整自动化链路：
#   写 Issue → 同步到 content/posts → Hugo 构建 → 部署到 Cloudflare Pages
#   全程无需人工干预，几分钟内网站自动更新
# ============================================================

name: Sync Issues

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  schedule:
    # 每天北京时间 04:00 同步一次（UTC 20:00）
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.140.0'
          extended: true

      - name: Sync Issues to Hugo posts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          EXCLUDE_LABELS: 'draft,private,wip'
        run: node scripts/sync-issues.js

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain content/posts/)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✓ 检测到内容变更"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "→ 无内容变更"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          git commit -m "chore: sync issues [skip ci]

          Triggered by: ${{ github.event_name }}
          Commit: ${{ github.sha }}"
          git push

      - name: Build with Hugo
        run: hugo --minify --gc

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main

      - name: Deployment summary
        run: |
          echo "## ✅ 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 网站地址: https://${{ secrets.CLOUDFLARE_PROJECT_NAME }}.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "- 触发方式: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- 内容变更: ${{ steps.changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
